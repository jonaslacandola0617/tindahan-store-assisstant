<div class="standalone">
<div class="standalone-panel">
  <div class="standalone-visual">
    <div>
      <span class="brand-mark">
        <span class="brand-glyph" style="background:rgba(255,255,255,0.16)"><svg class="icon" aria-hidden="true"><use href="#icon-store"></use></svg></span>
        <span class="brand-word" style="color:#fff">Tindahan</span>
      </span>
    </div>
    <div>
      <h2 style="color:#fff;font-size:var(--text-2xl);max-width:320px;line-height:1.3">
        <span class="i18n" data-en="Your store, organized." data-fil="Ang tindahan mo, maayos.">Your store, organized.</span>
      </h2>
      <p style="color:rgba(255,255,255,0.78);margin-top:var(--space-3);max-width:300px">
        <span class="i18n" data-en="Scan receipts, track what's running low, and record sales in seconds — right from the counter." data-fil="I-scan ang resibo, alamin kung ano ang paubos na, at itala ang benta sa ilang segundo lang — mula mismo sa counter.">Scan receipts, track what's running low, and record sales in seconds — right from the counter.</span>
      </p>
    </div>
    <div class="step-indicator" aria-hidden="true">
      <span class="step-dot active"></span><span class="step-dot"></span><span class="step-dot"></span>
    </div>
  </div>

  <div class="standalone-form">
    <div class="segmented" data-lang-toggle role="group" aria-label="Language" style="align-self:flex-end;margin-bottom:var(--space-6)">
      <button type="button" data-lang-option="en" class="active">EN</button>
      <button type="button" data-lang-option="fil">FIL</button>
    </div>

    <h1 style="margin-bottom:var(--space-2)"><span class="i18n" data-en="Welcome back" data-fil="Maligayang pagbabalik">Welcome back</span></h1>
    <p class="text-muted" style="margin-bottom:var(--space-6)">
      <span class="i18n" data-en="Sign in to keep running your store." data-fil="Mag-sign in para ipagpatuloy ang iyong tindahan.">Sign in to keep running your store.</span>
    </p>

    <form onsubmit="event.preventDefault(); window.location='dashboard.html';" style="display:flex;flex-direction:column;gap:var(--space-5)">
      <div class="field">
        <label class="field-label" for="phone"><span class="i18n" data-en="Mobile number or email" data-fil="Numero ng cellphone o email">Mobile number or email</span></label>
        <input class="input" id="phone" type="text" placeholder="0917 123 4567" value="0917 123 4567" autocomplete="username">
      </div>
      <div class="field">
        <label class="field-label" for="pass"><span class="i18n" data-en="Password" data-fil="Password">Password</span></label>
        <input class="input" id="pass" type="password" placeholder="••••••••" value="tindahan123" autocomplete="current-password">
        <span class="field-hint"><span class="i18n" data-en="Prototype only — any password works." data-fil="Prototype lang ito — kahit anong password ay tatanggapin.">Prototype only — any password works.</span></span>
      </div>
      <button class="btn btn-primary btn-lg btn-block" type="submit">
        <span class="i18n" data-en="Sign in" data-fil="Mag-sign in">Sign in</span>
      </button>
    </form>

    <div style="display:flex;align-items:center;gap:var(--space-3);margin:var(--space-6) 0">
      <hr class="divider" style="margin:0;flex:1">
      <span class="text-sm text-faint"><span class="i18n" data-en="or" data-fil="o">or</span></span>
      <hr class="divider" style="margin:0;flex:1">
    </div>

    <a class="btn btn-secondary btn-lg btn-block" href="onboarding.html">
      <span class="i18n" data-en="Set up a new store" data-fil="Mag-set up ng bagong tindahan">Set up a new store</span>
    </a>
  </div>
</div>
</div><div class="toast-region" role="status" aria-live="polite"></div><script src="js/app.js"></script>
