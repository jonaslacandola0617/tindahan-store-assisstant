name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tindahan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tindahan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tindahan_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/tindahan_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tindahan_test
      TEST_DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tindahan_test
      NEXTAUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      NEXTAUTH_URL: http://localhost:3000
      RECEIPT_STORAGE_PROVIDER: local
      RECEIPT_OCR_PROVIDER: mock
      RATE_LIMIT_PROVIDER: memory
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
