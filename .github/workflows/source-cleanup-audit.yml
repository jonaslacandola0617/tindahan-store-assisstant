name: Source Cleanup Audit

on:
  push:
    branches: [chore/source-cleanup]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Scan development-agent traces
        shell: bash
        run: |
          echo '--- development-agent trace scan ---'
          grep -RInE 'Claude|Codex|ChatGPT|AI agent|generated by|handoff|implementation prompt|system prompt' \
            src scripts design docs infra prisma README.md CONTRIBUTING.md package.json .env.example \
            --exclude='pnpm-lock.yaml' || true
          echo '--- stale phase naming scan ---'
          grep -RInEi 'phase[[:space:]_-]*[0-9]+' src scripts design docs infra README.md CONTRIBUTING.md || true
      - name: Verify candidate references
        shell: bash
        run: |
          for term in registerUser registeredUserExists createStoreForOwner activeMembershipForStore canManageStore '/receipt-upload' 'seed-report-demo'; do
            echo "--- $term ---"
            grep -RInF "$term" src scripts design docs infra prisma README.md CONTRIBUTING.md package.json .env.example --exclude='pnpm-lock.yaml' || true
          done
      - name: Find unused files and exports
        shell: bash
        run: |
          echo '--- knip report ---'
          pnpm dlx --package=knip@5.64.0 --package=typescript@5.9.3 knip --include files,exports,types,dependencies,devDependencies,unlisted,binaries || true
