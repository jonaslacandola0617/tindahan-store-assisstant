name: Source Cleanup Audit

on:
  push:
    branches: [chore/source-cleanup]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm exec vitest run --exclude='**/*.integration.test.ts' --exclude='**/*.smoke.test.ts'
      - name: Production build
        run: pnpm build
      - name: Scan development-agent traces
        shell: bash
        run: |
          echo '--- development-agent trace scan ---'
          if grep -RInE 'Claude|Codex|ChatGPT|AI agent|handoff|implementation prompt|system prompt' \
            src scripts design docs infra prisma README.md CONTRIBUTING.md package.json .env.example \
            --exclude-dir=generated --exclude='pnpm-lock.yaml'; then
            echo 'Development-agent wording remains in tracked project sources.'
            exit 1
          fi
          echo 'No development-agent wording found.'
          echo '--- stale phase naming scan ---'
          grep -RInEi 'phase[[:space:]_-]*[0-9]+' src scripts design docs infra README.md CONTRIBUTING.md || true
      - name: Verify removed helpers stay unreferenced
        shell: bash
        run: |
          for term in activeMembershipForStore canManageStore 'tindahan-static-prototype.zip'; do
            if grep -RInF "$term" src scripts design docs infra prisma README.md CONTRIBUTING.md package.json .env.example --exclude='pnpm-lock.yaml'; then
              echo "Unexpected stale reference: $term"
              exit 1
            fi
          done
      - name: Advisory unused-code report
        shell: bash
        run: |
          pnpm dlx --package=knip@5.64.0 --package=typescript@5.9.3 knip --include files,exports,types,dependencies,devDependencies,unlisted,binaries || true
