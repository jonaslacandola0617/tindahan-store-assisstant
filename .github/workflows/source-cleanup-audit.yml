name: Source Cleanup Audit

on:
  push:
    branches: [chore/source-cleanup]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Scan development-agent traces
        shell: bash
        run: |
          echo '--- development-agent trace scan ---'
          grep -RInE 'Claude|Codex|ChatGPT|AI agent|generated by|handoff|implementation prompt|system prompt' \
            src scripts design docs infra prisma README.md CONTRIBUTING.md package.json .env.example \
            --exclude='pnpm-lock.yaml' || true
      - name: Find unused files and exports
        shell: bash
        run: |
          echo '--- knip report ---'
          pnpm dlx knip@5.64.0 --include files,exports,types,dependencies,devDependencies,unlisted,binaries || true
