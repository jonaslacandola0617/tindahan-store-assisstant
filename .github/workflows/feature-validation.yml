name: Feature validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tindahan_test
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/tindahan_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tindahan_test
      TEST_DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tindahan_test
      NEXTAUTH_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      NEXTAUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      EMAIL_PROVIDER: mock
      RECEIPT_STORAGE_PROVIDER: local
      RECEIPT_OCR_PROVIDER: mock
      RATE_LIMIT_PROVIDER: memory
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test -- src/modules/operating-view/application/operational-email.test.ts src/modules/saas/application/operational-email-template.test.ts src/modules/receipts/application/receipt-object-event.test.ts
      - run: pnpm build
